<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:"
    />
    <title>Octop Bot</title>
  </head>
  <body>
    <main>
      <h1 id="title"></h1>
      <p id="hint"></p>
      <form id="form" novalidate>
        <input id="address" type="url" inputmode="url" autocomplete="url" spellcheck="false" autofocus />
        <p id="error" role="alert"></p>
        <ul id="recent"></ul>
        <div class="actions">
          <button id="local" type="button" class="link" hidden></button>
          <span class="spacer"></span>
          <button id="cancel" type="button"></button>
          <button id="connect" type="submit" class="primary"></button>
        </div>
      </form>
    </main>
    <script type="module" src="./src/server.ts"></script>
  </body>
</html>
