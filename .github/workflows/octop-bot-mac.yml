name: Octop Bot macOS

# Builds the signed and notarized arm64 Octop Bot DMG with
# desktop/src/scripts/package-bot-mac.py. Credentials come only from these
# repository secrets (docs/octop-bot-updates.md, "mac 签名与公证"):
#   MAC_CERT_P12_BASE64          Developer ID Application certificate + key (.p12), base64
#   MAC_CERT_PASSWORD            password of that .p12
#   APPLE_API_KEY_P8_BASE64      App Store Connect API key (AuthKey_XXXX.p8), base64
#   APPLE_API_KEY_ID             its Key ID
#   APPLE_API_ISSUER             its Issuer ID
# The Windows client has its own manual workflow, octop-bot-windows.yml. The
# inherited octop-desktop.yml builds the upstream Octop app.

on:
  push:
    tags:
      - "octop-bot-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: octop-bot-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-arm64:
    name: darwin-arm64 DMG
    if: github.repository == 'alison-xx/octop-bot'
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Check signing secrets
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=()
          for name in MAC_CERT_P12_BASE64 MAC_CERT_PASSWORD APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing repository secrets: ${missing[*]}"
            exit 1
          fi

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0
          run_install: false

      - name: Install dashboard and shell dependencies
        run: |
          set -euo pipefail
          (cd dashboard && npm ci)
          (cd desktop/src && pnpm install --frozen-lockfile)

      - name: Write notarization API key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        working-directory: desktop/src
        env:
          # electron-builder imports this .p12 into a temporary keychain.
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm run package:bot:mac

      - name: Remove notarization API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      - uses: actions/upload-artifact@v7
        with:
          path: desktop/src/release/octop-bot/Octop-Bot-*-mac-arm64.dmg
          if-no-files-found: error
          retention-days: 14
