name: OctopBot
options:
  bundleIdPrefix: cn.lynxce
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "3"
    DEVELOPMENT_TEAM: F7URANQHX7
targets:
  OctopBot:
    type: application
    platform: iOS
    sources:
      - path: OctopBot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.lynxce.octopbot
        PRODUCT_NAME: OctopBot
        INFOPLIST_FILE: OctopBot/Info.plist
        CODE_SIGN_ENTITLEMENTS: OctopBot/OctopBot.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  OctopBotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OctopBotTests
    dependencies:
      - target: OctopBot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.lynxce.octopbot.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OctopBot.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/OctopBot"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  OctopBot:
    build:
      targets:
        OctopBot: all
        OctopBotTests: [test]
    test:
      targets:
        - OctopBotTests
