<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新用户引导原型</title>
<style>
  :root {
    --bg: #fbfaf8; --side: #f4f3f0; --line: #e8e6e1; --ink: #1d1c1a; --muted: #8a877f;
    --bubble: #efeeeb; --accent: #ff5a5f; --accent-soft: #fff1ef; --glow: #ffd86b;
    --card: #ffffff; --shadow: 0 12px 40px rgba(30, 25, 15, .14);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 14px/1.55 -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    color: var(--ink); background: var(--bg); overflow: hidden; }
  button { font: inherit; cursor: pointer; }
  .proto { position: fixed; top: 0; left: 0; right: 0; height: 34px; z-index: 50; background: #24221f; color: #eee;
    display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 12px; }
  .proto b { color: #ffd86b; font-weight: 600; }
  .proto button { background: #3a3733; color: #eee; border: 0; border-radius: 6px; padding: 3px 10px; }
  .proto .dots { display: flex; gap: 4px; margin-left: auto; }
  .proto .dots button { padding: 3px 8px; }
  .proto .dots button[aria-current] { background: #ffd86b; color: #24221f; }
  body.clean .proto { display: none; }
  .app { position: absolute; inset: 34px 0 0 0; display: flex; }
  body.clean .app { inset: 0; }

  /* sidebar */
  .side { width: 280px; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; position: relative; }
  .brand { display: flex; align-items: center; gap: 8px; padding: 16px 18px; font-weight: 700; font-size: 16px; }
  .brand img { width: 26px; }
  .brand .icons { margin-left: auto; display: flex; gap: 8px; }
  .brand .icons span { width: 30px; height: 30px; border-radius: 9px; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; color: #555; font-weight: 400; }
  .chief { text-align: center; padding: 6px 0 14px; border-radius: 14px; margin: 0 14px; }
  .chief img { width: 64px; }
  .chief .n { font-weight: 600; }
  .chief .tag { display: inline-block; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; background: #fff; }
  .chief.on { background: #e9e7e2; }
  .sect { padding: 8px 14px 0; }
  .sect h4 { margin: 8px 6px 6px; font-size: 12px; color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .sect h4 .dot { width: 7px; height: 7px; border-radius: 50%; background: #e0a23a; }
  .item { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 12px; position: relative; }
  .item .t { font-weight: 600; font-size: 14px; }
  .item .s { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
  .item.on { background: #e6e4df; }
  .item .new { margin-left: auto; font-size: 10px; background: var(--accent); color: #fff; border-radius: 8px; padding: 0 6px; }
  .glow { animation: glow 1.6s ease-in-out infinite; }
  @keyframes glow { 0%,100% { box-shadow: 0 0 0 0 rgba(255,216,107,0); background: #fff7dc; } 50% { box-shadow: 0 0 0 4px rgba(255,216,107,.55); background: #fff2c4; } }
  .empty-hint { margin: 18px 20px; font-size: 12px; color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; padding: 12px; text-align: center; }
  .account { margin-top: auto; padding: 14px; }
  .account span { display: block; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; color: #444; }

  /* main */
  .main { flex: 1; display: flex; flex-direction: column; position: relative; min-width: 0; }
  .top { height: 58px; display: flex; align-items: center; justify-content: center; position: relative; }
  .pill { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 14px; padding: 5px 12px; background: #fff; font-weight: 600; }
  .pill .av { display: flex; }
  .pill .av svg, .pill .av img { width: 20px; height: 20px; margin-left: -4px; }
  .stack { display: grid; grid-template-columns: 17px 17px; gap: 0; width: 36px; flex: none; }
  .stack svg, .stack img { width: 17px !important; height: 17px; }
  .skip { position: absolute; right: 18px; top: 16px; border: 0; background: none; color: var(--muted); font-size: 13px; }
  .feed { flex: 1; overflow: auto; padding: 8px 64px 18px; display: flex; flex-direction: column; gap: 14px; }
  .time { align-self: center; color: var(--muted); font-size: 12px; }
  .row { display: flex; gap: 10px; align-items: flex-start; max-width: 760px; }
  .row .ava { width: 34px; flex: none; }
  .row .ava img, .row .ava svg { width: 34px; height: 34px; }
  .who { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .who b { color: #b7334f; font-weight: 600; margin-right: 6px; }
  .who .admin { font-size: 11px; border: 1px solid var(--line); border-radius: 5px; padding: 0 4px; margin-right: 6px; }
  .bubble { background: var(--bubble); border-radius: 16px; padding: 10px 14px; white-space: pre-wrap; }
  .me { align-self: flex-end; background: #1d1c1a; color: #fff; border-radius: 16px; padding: 10px 16px; max-width: 600px; }
  .receipts { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .receipt { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 7px 10px; font-size: 13px; opacity: 0; transform: translateY(4px); animation: pop .35s ease forwards; }
  .receipt svg { width: 22px; height: 22px; }
  .receipt .k { color: var(--muted); }
  .receipt .ok { margin-left: auto; color: #2f9e6b; font-size: 12px; }
  @keyframes pop { to { opacity: 1; transform: none; } }
  body.clean .receipt { animation: none; opacity: 1; transform: none; }
  .working { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .working i { width: 6px; height: 6px; border-radius: 50%; background: #c9c5bc; animation: blink 1s infinite; }
  .working i:nth-child(2) { animation-delay: .2s } .working i:nth-child(3) { animation-delay: .4s }
  @keyframes blink { 50% { background: #6d6a63; } }
  .cta { display: flex; align-items: center; gap: 12px; margin-top: 10px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; box-shadow: 0 2px 10px rgba(0,0,0,.04); }
  .cta .grp { display: flex; } .cta .grp svg, .cta .grp img { width: 26px; height: 26px; margin-left: -6px; }
  .cta .txt { flex: 1; } .cta .txt small { display: block; color: var(--muted); }
  .btn { border: 0; border-radius: 10px; padding: 8px 14px; background: var(--ink); color: #fff; font-weight: 600; }
  .btn.ghost { background: transparent; color: var(--muted); font-weight: 400; }
  .btn.accent { background: var(--accent); }

  /* guide strip + composer */
  .dock { padding: 0 64px 22px; position: relative; }
  .guide { background: #fff; border: 1px solid #f3d9a4; border-radius: 16px; padding: 12px 14px; margin-bottom: 10px; box-shadow: 0 6px 24px rgba(224, 162, 58, .14); }
  .guide .head { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .guide .head img { width: 24px; }
  .guide .head .step { font-size: 11px; color: #b07a12; background: #fff4d6; border-radius: 6px; padding: 1px 7px; font-weight: 500; }
  .guide .head .x { margin-left: auto; border: 0; background: none; color: var(--muted); font-size: 12px; font-weight: 400; }
  .guide p { margin: 4px 0 8px 32px; color: #5b5850; font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-left: 32px; }
  .chip { border: 1px solid var(--line); background: #faf9f7; border-radius: 999px; padding: 5px 12px; font-size: 13px; }
  .chip:hover, .chip.picked { border-color: var(--ink); background: #fff; }
  .chip.write { color: var(--muted); border-style: dashed; }
  .composer { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 8px 8px 8px 12px; }
  .composer.focus { border-color: #1d1c1a; box-shadow: 0 0 0 3px rgba(29,28,26,.08); }
  .composer .plus { width: 32px; height: 32px; border-radius: 10px; background: #f1f0ed; display: grid; place-items: center; color: #777; }
  .composer .input { flex: 1; color: var(--muted); min-height: 22px; }
  .composer .input.filled { color: var(--ink); }
  .send { width: 34px; height: 34px; border-radius: 50%; border: 0; background: #e8e6e1; color: #aaa; font-size: 16px; }
  .send.ready { background: var(--ink); color: #fff; }

  /* coach bubble */
  .coach { position: absolute; z-index: 20; background: #1d1c1a; color: #fff; border-radius: 12px; padding: 10px 12px; width: 230px; font-size: 13px; box-shadow: var(--shadow); }
  .coach b { display: block; margin-bottom: 2px; color: #ffd86b; }
  .coach::before { content: ""; position: absolute; left: -7px; top: 18px; border: 7px solid transparent; border-left: 0; border-right-color: #1d1c1a; }
  .coach .btn { margin-top: 8px; background: #ffd86b; color: #1d1c1a; padding: 5px 10px; font-size: 12px; }

  /* modal */
  .scrim { position: absolute; inset: 0; background: rgba(250, 248, 244, .72); backdrop-filter: blur(3px); z-index: 30; display: grid; place-items: center; }
  .modal { width: 520px; background: #fff; border-radius: 22px; box-shadow: var(--shadow); padding: 28px 32px 22px; text-align: center; }
  .modal img.m { width: 96px; }
  .modal h2 { margin: 6px 0 6px; font-size: 22px; }
  .modal .lead { color: #5b5850; margin: 0 0 18px; }
  .flow { display: flex; gap: 10px; margin-bottom: 20px; }
  .flow div { flex: 1; background: #faf9f7; border: 1px solid var(--line); border-radius: 14px; padding: 12px 8px; font-size: 12px; color: #5b5850; }
  .flow div b { display: block; font-size: 13px; color: var(--ink); margin: 4px 0 2px; }
  .flow .num { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 12px; }
  .modal .actions { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .modal .actions .btn { width: 100%; padding: 11px; font-size: 15px; }
  .modal .foot { margin-top: 10px; font-size: 12px; color: var(--muted); }
  .modal.wide { width: 680px; padding: 22px 26px 18px; }
  .modal.wide img { width: 64px !important; }
  .inds { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 4px 0 12px; text-align: left; }
  .ind { border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; background: #faf9f7; cursor: pointer; }
  .ind b { display: block; font-size: 13px; }
  .ind small { display: block; color: var(--muted); font-size: 11px; line-height: 1.35; margin-top: 2px; }
  .ind.on { border-color: var(--ink); background: #fff; box-shadow: 0 0 0 2px rgba(29,28,26,.08); }
  .ind.other { border-style: dashed; }
  .note { text-align: left; margin-bottom: 14px; }
  .note label { font-size: 12px; color: #5b5850; }
  .note .box { margin-top: 4px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-height: 38px; color: var(--muted); font-size: 13px; background: #fff; }
  .note .box.filled { color: var(--ink); }
  .row2 { display: flex; gap: 10px; }
  .row2 .btn { flex: 1; padding: 11px; font-size: 15px; }
  .row2 .btn.plain { background: #f1f0ed; color: #3d3b37; font-weight: 500; }
  .btn[disabled] { opacity: .35; }

  .toast { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 10px 16px; box-shadow: var(--shadow); display: flex; gap: 10px; align-items: center; z-index: 25; }
  .toast img { width: 28px; }
  .toast small { display: block; color: var(--muted); }
  .credits { margin-top: 8px; background: #fff; border: 1px solid #f2c9c0; border-radius: 14px; padding: 12px 14px; }
  .credits strong { display: block; margin-bottom: 2px; }
  .credits p { margin: 0 0 8px; color: #5b5850; font-size: 13px; }
</style>
</head>

  <b>新用户引导 · 可点原型</b><span id="stepName"></span>
  <button id="prev">上一步</button><button id="next">下一步</button>
  <div class="dots" id="dots"></div>
</div>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main" id="main"></main>
</div>

  }[shape];
  return '<svg viewBox="0 0 40 40">' + body +
    '<ellipse cx="16" cy="21" rx="2" ry="2.6" fill="#fff"/><ellipse cx="24" cy="21" rx="2" ry="2.6" fill="#fff"/>' +
    '<circle cx="16.4" cy="21.6" r="1" fill="#222"/><circle cx="24.4" cy="21.6" r="1" fill="#222"/></svg>';
}
const TEAM = [
  { name: "阿贸", role: "询盘回复与报价", look: blob("star", "amber"), admin: true },
  { name: "小选", role: "选品与竞品分析", look: blob("drop", "teal") },
  { name: "Mia", role: "海外社媒内容", look: blob("cloud", "violet") },
];
const chiefImg = (w) => '<img src="' + MASCOT + '" style="width:' + w + 'px" alt="">';
const groupAv = () => TEAM.map(b => b.look).join("");
const INDUSTRIES = [
  ["电商零售", "商品上新 · 客服话术 · 店铺日报"], ["内容创作", "短视频编导 · 公众号 · 小红书"],
  ["市场营销", "活动策划 · 竞品情报 · 搜索内容"], ["销售", "线索开发 · 客户跟进 · 通话复盘"],
  ["财务", "报销票据 · 现金流 · 财报速读"], ["法务合规", "合同审阅 · 合规速查 · 用工顾问"],
  ["人力招聘", "简历初筛 · 面试协调 · 入职向导"], ["教育培训", "备课 · 作业辅导 · 口语陪练"],
  ["研发技术", "需求拆解 · 代码审查 · 线上巡检"], ["个人生活", "旅行规划 · 家庭记账 · 健身饮食"],
  ["外贸出口", "询盘报价 · 选品分析 · 海外社媒"], ["餐饮门店", "门店日报 · 活动策划 · 点评回复"],
];
const EXAMPLES = ["外贸出口"];
const FIRST = "下周有个美国客户询价 500 个保温杯，帮我回一封报价邮件，再配一条 LinkedIn 动态。";
const NOTE = "主要做家居用品，走亚马逊美国站。";
const PICKED = "我做外贸出口。补充：" + NOTE + "请帮我组一支团队，再建好群聊。";
let picked = "";

function sidebar(step) {
  const built = ["4", "5", "6"].includes(step);
  const hot = step === "4";
  let h = '<div class="brand">' + chiefImg(26) + 'Octop Bot<div class="icons"><span>⌕</span><span>+</span></div></div>';
  h += '<div class="chief ' + (built && step !== "4" ? "" : "on") + '">' + chiefImg(64) + '<div class="n">Chief</div><span class="tag">总管</span></div>';
  if (!built) {
    h += '<div class="empty-hint">还没有 Bot 和群聊。<br>和总管说一句话，它来帮你组队。</div>';
  } else {
    h += '<div class="sect"><h4>群聊 1</h4>' +
      '<div class="item ' + (hot ? "glow" : "") + (step !== "4" ? " on" : "") + '" id="grpItem"><span class="stack">' + groupAv() + '</span>' +
      '<div><div class="t">外贸团队</div><div class="s">' + (step === "6" ? "阿贸 · 收到。我先起草报价邮件…" : "阿贸 · 小选 · Mia") + '</div></div>' + (hot ? '<span class="new">新</span>' : "") + '</div></div>';
    h += '<div class="sect"><h4><span class="dot"></span>外贸团队 3</h4>' + TEAM.map(b =>
      '<div class="item ' + (hot ? "glow" : "") + '"><span style="width:34px;height:34px;display:block">' + b.look + '</span><div><div class="t">' + b.name + '</div><div class="s">' + b.role + '</div></div>' + (hot ? '<span class="new">新</span>' : "") + '</div>').join("") + '</div>';
  }
  h += '<div class="account"><span>☰ 账号与模型</span></div>';
  if (hot) h += '<div class="coach" style="left:292px;top:256px"><b>你的团队建好了</b>新建的群聊和 3 个 Bot 已放进左侧「外贸团队」分组。点群聊进去派第一个活。<br><button class="btn" onclick="go(\'5\')">进入群聊</button></div>';
  return h;
}

function guide(stepLabel, title, text, extra) {
  return '<div class="guide"><div class="head">' + chiefImg(24) + title + '<span class="step">' + stepLabel + '</span><button class="x" onclick="go(\'skip\')">跳过引导</button></div>' +
    (text ? '<p>' + text + '</p>' : "") + (extra || "") + '</div>';
}
function composer(text, placeholder, ready, onsend) {
  return '<div class="composer ' + (ready ? "focus" : "") + '"><span class="plus">+</span><div class="input ' + (text ? "filled" : "") + '">' + (text || placeholder) +
    '</div><button class="send ' + (ready ? "ready" : "") + '" ' + (ready ? 'onclick="' + onsend + '"' : "disabled") + ' aria-label="发送">↑</button></div>';
}
function chiefRow(content, time) {
  return '<div class="row"><div class="ava">' + chiefImg(34) + '</div><div><div class="who"><b>Chief</b>' + (time || "") + '</div>' + content + '</div></div>';
}
const WELCOME = '<div class="bubble">你希望谁一起工作？告诉我想要的结果，我可以帮你组建团队。</div>';
const RECEIPTS = (n) => '<div class="receipts">' +
  TEAM.slice(0, n).map((b, i) => '<div class="receipt" style="animation-delay:' + (i * .5) + 's">' + b.look + '<span class="k">已创建 Bot</span><b>' + b.name + '</b><span class="k">· ' + b.role + '</span><span class="ok">✓</span></div>').join("") +
  (n > 3 ? '<div class="receipt" style="animation-delay:1.6s"><span class="stack">' + groupAv() + '</span><span class="k">已建群聊</span><b>外贸团队</b><span class="k">· 管理员 阿贸</span><span class="ok">✓</span></div>' : "") + '</div>';
const DONE_REPLY = '<div class="bubble">外贸团队建好了，放在左侧「外贸团队」分组：\n· 阿贸：询盘回复与报价，群管理员\n· 小选：选品与竞品分析\n· Mia：海外社媒内容\n\n去群里试一句：「' + FIRST + '」</div>';

function main(step) {
  const top = (inner) => '<div class="top">' + inner + '</div>';
  const chiefTop = top('<span class="pill">' + chiefImg(20) + 'Chief</span>');
  const groupTop = top('<span class="pill"><span class="av">' + groupAv() + '</span>外贸团队 · 3 位成员</span>');
  if (step === "1" || step === "2" || step === "skip") {
    let h = chiefTop + '<div class="feed"><span class="time">今天 09:30</span>' + chiefRow(WELCOME) + '</div><div class="dock">' + composer("", "给 Chief 发消息", false) + '</div>';
    if (step === "skip") return h + '<div class="toast">' + chiefImg(28) + '<div>已跳过新手引导<small>想再看，可在「账号与模型」菜单 → 新手引导 打开</small></div></div>';
    const chosen = step === "2" ? "外贸出口" : picked;
    const cards = INDUSTRIES.map(([n, r]) => '<div class="ind ' + (chosen === n ? "on" : "") + '" onclick="pick(\'' + n + '\')"><b>' + n + '</b><small>' + r + '</small></div>').join("") +
      '<div class="ind other"><b>其他，自己写</b><small>比如：独立摄影师、宠物店</small></div>';
    h += '<div class="scrim"><div class="modal wide" role="dialog" aria-label="欢迎">' + chiefImg(64) +
      '<h2>欢迎，我是总管 Chief</h2><p class="lead">你做哪一行？选一个，我按它组一支 Bot 团队，再建好群聊。大约 1 分钟。</p>' +
      '<div class="inds">' + cards + '</div>' +
      '<div class="note"><label>补一句具体需求（可选）</label><div class="box ' + (chosen ? "filled" : "") + '">' + (chosen ? NOTE : "比如：主要做家居用品，走亚马逊美国站") + '</div></div>' +
      '<div class="row2"><button class="btn plain" onclick="go(\'skip\')">跳过引导</button><button class="btn accent" ' + (chosen ? 'onclick="go(\'3\')"' : "disabled") + '>让总管组队</button></div>' +
      '<div class="foot">跳过后不再弹出，随时可在左下角「账号与模型」菜单 → 新手引导 重新打开</div></div></div>';
    return h;
  }
  if (step === "3" || step === "credits") {
    const body = step === "credits"
      ? '<div class="credits" role="alert"><strong>积分用完了</strong><p>组队需要总管回复，当前灵策账号积分不足。充值后点「继续」，总管会接着刚才那句话组队。</p><button class="btn accent">去充值</button> <button class="btn ghost">继续</button></div>'
      : RECEIPTS(2) + '<div class="working" style="margin-top:8px"><i></i><i></i><i></i>正在组建团队</div>';
    return chiefTop + '<div class="feed"><span class="time">今天 09:30</span>' + chiefRow(WELCOME) +
      '<div class="me">' + PICKED + '</div>' + chiefRow(body, "09:31") + '</div><div class="dock">' +
      guide("第 2 步 / 共 3 步", step === "credits" ? "等你充值后继续" : "总管正在组队", step === "credits" ? "引导会停在这一步，充值回来接着走。" : "通常 20–40 秒。建好的 Bot 和群会出现在左侧。") +
      composer("", "给 Chief 发消息", false) + '</div>';
  }
  if (step === "4") {
    return chiefTop + '<div class="feed"><span class="time">今天 09:30</span>' + chiefRow(WELCOME) +
      '<div class="me">' + PICKED + '</div>' + chiefRow(RECEIPTS(4).replace(/animation-delay:[^"]+/g, "animation-delay:0s") + '<div style="height:8px"></div>' + DONE_REPLY +
      '<div class="cta"><span class="grp">' + groupAv() + '</span><div class="txt"><b>外贸团队</b><small>阿贸（管理员）· 小选 · Mia</small></div><button class="btn" onclick="go(\'5\')">进入群聊 →</button></div>', "09:31") +
      '</div><div class="dock">' + composer("", "给 Chief 发消息", false) + '</div>';
  }
  if (step === "5") {
    return groupTop + '<div class="feed"><span class="time">今天 09:32</span>' +
      '<div class="row" style="align-self:center;max-width:520px;text-align:center;color:var(--muted);font-size:13px">Chief 建了群聊「外贸团队」。管理员 阿贸 先回复，需要时 @ 同事接力。</div></div>' +
      '<div class="dock">' + guide("第 3 步 / 共 3 步", "在群里发第一条消息", "总管已经帮你写好一句，直接发送就行，也可以改。想点名某个 Bot，就输入 @ 选它。") +
      composer(FIRST, "", true, "go('6')") + '</div>';
  }
  if (step === "6") {
    const row = (b, text, t) => '<div class="row"><div class="ava">' + b.look + '</div><div><div class="who"><b style="color:#8a5a00">' + b.name + '</b>' + (b.admin ? '<span class="admin">管理员</span>' : "") + t + '</div><div class="bubble">' + text + '</div></div></div>';
    return groupTop + '<div class="feed"><span class="time">今天 09:32</span><div class="me">' + FIRST + '</div>' +
      row(TEAM[0], "收到。我先起草报价邮件。@小选 帮我查同类 500ml 保温杯的 FOB 价区间，@Mia 等报价定了写 LinkedIn 动态。", "09:32") +
      row(TEAM[1], "同类 500ml 双层不锈钢杯，阿里国际站 FOB 宁波 2.8–4.2 美元。建议报 3.6，留出议价空间。", "09:33") +
      '<div class="working" style="margin-left:44px"><i></i><i></i><i></i>Mia 正在写</div></div>' +
      '<div class="dock">' + composer("", "给 外贸团队 发消息", false) + '</div>' +
      '<div class="toast">' + chiefImg(28) + '<div>新手引导完成<small>团队已经开工。随时可在「账号与模型」菜单 → 新手引导 再看一遍</small></div></div>';
  }
}
function pick(text) { picked = text; render(cur()); }
function render(step, focusOnly) {
  document.getElementById("side").innerHTML = sidebar(step);
  document.getElementById("main").innerHTML = main(step);
  if (focusOnly) document.querySelector(".composer").classList.add("focus");
  const i = STEPS.findIndex(s => s[0] === step);
  document.getElementById("stepName").textContent = step === "skip" ? "（跳过后的样子）" : "第 " + (i + 1) + " 屏 · " + STEPS[i][1];
  document.querySelectorAll("#dots button").forEach(b => b.toggleAttribute("aria-current", b.dataset.s === step));
  if (step === "3") setTimeout(() => { if (location.hash === "#3") go("4"); }, 3200);
}
function go(step) { if (step === "2" && !picked && location.hash !== "#2") picked = ""; location.hash = step; }
document.getElementById("dots").innerHTML = STEPS.map(s => '<button data-s="' + s[0] + '" onclick="go(\'' + s[0] + '\')">' + (s[0] === "credits" ? "积分" : s[0]) + '</button>').join("");
document.getElementById("prev").onclick = () => { const i = STEPS.findIndex(s => s[0] === cur()); go(STEPS[Math.max(0, i - 1)][0]); };
document.getElementById("next").onclick = () => { const i = STEPS.findIndex(s => s[0] === cur()); if (cur() === "2" && !picked) picked = EXAMPLES[0]; go(STEPS[Math.min(STEPS.length - 1, i + 1)][0]); };
const cur = () => (location.hash.slice(1) || "1");
const params = new URLSearchParams(location.search);
if (params.has("clean")) document.body.classList.add("clean");
if (params.get("pick")) picked = EXAMPLES[0];
window.onhashchange = () => render(cur());
render(cur());
</script>
</body>
</html>
